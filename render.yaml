services:
  - type: web
    name: ceo-arena-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ceo-arena-web.onrender.com

  - type: web
    name: ceo-arena-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://ceo-arena-api.onrender.com/api
